
<!DOCTYPE html>
<html>
<head>
    <title>Edit Application - SmartHire</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/svg+xml"
      href="{{ url_for('static', filename='favicon.svg') }}">

</head>
<body>

<div class="form-container">
    <div class="form-header">
        <h2>Edit Application</h2>
        <p>Update your job application details</p>
    </div>

    <form method="POST"
          action="{{ url_for('edit_job', app_id=application['id']) }}"
          class="job-form">

        <div class="form-grid">

            <div class="field">
                <label>Company Name</label>
                <input type="text" name="company"
                       value="{{ application['company'] }}" required>
            </div>

            <div class="field">
                <label>Job Position</label>
                <input type="text" name="position"
                       value="{{ application['position'] }}" required>
            </div>

            <div class="field">
                <label>Location</label>
                <input type="text" name="location"
                       value="{{ application['location'] or '' }}">
            </div>

            <div class="field">
                <label>Salary</label>
                <input type="text" name="salary"
                       value="{{ application['salary'] or '' }}">
            </div>

            <div class="field">
                <label>Application Date</label>
                <input type="date" name="application_date"
                       value="{{ application['application_date'] }}" required>
            </div>

            <div class="field">
                <label>Status</label>
                <select name="status" required>
                    {% for status in ['Applied', 'Pending', 'Interview', 'Selected', 'Offer Received', 'Rejected'] %}
                    <option value="{{ status }}"
                        {% if application['status'] == status %}selected{% endif %}>
                        {{ status }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="field full">
                <label>Job Description</label>
                <textarea name="description" rows="5">{{ application['description'] or '' }}</textarea>
            </div>

        </div>

        <div class="form-actions">
            <a href="{{ url_for('home') }}" class="cancel-btn">Cancel</a>
            <button type="submit" class="save-btn">Update Application</button>
        </div>

    </form>
</div>

</body>
</html>
